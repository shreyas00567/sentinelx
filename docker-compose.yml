services:
  db:
    image: postgres:16-alpine
    container_name: sentinelx-db
    environment:
      POSTGRES_DB: ${DB_NAME:-sentinelx}
      POSTGRES_USER: ${DB_USER:-sentinelx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinelx}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sentinelx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sentinelx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: sentinelx-ml
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx-api
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sentinelx}
      DB_USER: ${DB_USER:-sentinelx}
      DB_PASSWORD: ${DB_PASSWORD:-sentinelx}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-sentinelx-1234567890}
      ML_BASE_URL: http://ml-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASS: ${SEED_ADMIN_PASS:-Admin@123}
      SEED_ANALYST_PASS: ${SEED_ANALYST_PASS:-Analyst@123}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/auth/login >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: sentinelx-web
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  sentinelx-pgdata:
